<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchant Portal - Private Feedback</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-lg bg-white rounded-3xl shadow-xl overflow-hidden p-6 md:p-8">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-900">🛡️ Merchant Portal</h1>
      <p class="text-xs text-slate-400 mt-1 uppercase tracking-wider">Private Feedback & Customer Insights</p>
    </div>

    <!-- Login Section -->
    <div id="login-section">
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1 uppercase">Shop ID (e.g. pj_kopi)</label>
          <input type="text" id="shop-id-input" class="w-full p-3.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500/20" placeholder="Enter your shop ID">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1 uppercase">Access PIN</label>
          <input type="password" id="shop-pin-input" class="w-full p-3.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500/20" placeholder="Enter 4-digit PIN">
        </div>
        <button onclick="merchantLogin()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg transition active:scale-95">
          Login to Dashboard
        </button>
      </div>
    </div>

    <!-- Dashboard Section (Hidden by default) -->
    <div id="dashboard-section" class="hidden">
      <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
        <div>
          <h2 id="dashboard-shop-name" class="text-lg font-bold text-slate-800">Shop Name</h2>
          <span class="text-xs text-emerald-600 font-medium bg-emerald-50 px-2 py-0.5 rounded-full">● Secure Session</span>
        </div>
        <button onclick="logout()" class="text-xs text-slate-400 hover:text-red-500 font-medium bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200 transition">Logout</button>
      </div>

      <h3 class="text-sm font-bold text-slate-700 mb-3 uppercase tracking-wider">Customer Private Feedback</h3>
      
      <div id="feedback-list" class="space-y-3 max-h-[350px] overflow-y-auto pr-1">
        <!-- Feedbacks will be injected here -->
      </div>
    </div>

  </div>

  <script>
    async function merchantLogin() {
      const shopId = document.getElementById('shop-id-input').value.trim();
      const pin = document.getElementById('shop-pin-input').value.trim();

      if (!shopId || !pin) {
        alert('Please enter both Shop ID and PIN.');
        return;
      }

      try {
        const res = await fetch('/api/merchant/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ shopId, pin })
        });
        const data = await res.json();

        if (data.success) {
          document.getElementById('dashboard-shop-name').innerText = data.shopName;
          
          const listContainer = document.getElementById('feedback-list');
          if (data.feedbacks.length === 0) {
            listContainer.innerHTML = `<div class="text-center py-10 text-slate-400 text-sm">No private feedback yet. Great job! 🎉</div>`;
          } else {
            listContainer.innerHTML = data.feedbacks.reverse().map(item => `
              <div class="p-4 bg-slate-50 border border-slate-200 rounded-2xl">
                <p class="text-sm text-slate-700 mb-2">"${item.feedback}"</p>
                <div class="flex justify-between items-center text-xs text-slate-400 pt-2 border-t border-slate-200/60">
                  <span>📱 Contact: <strong class="text-slate-600">${item.contact || 'Not provided'}</strong></span>
                  <span>🕒 ${new Date(item.timestamp).toLocaleDateString()}</span>
                </div>
              </div>
            `).join('');
          }

          document.getElementById('login-section').classList.add('hidden');
          document.getElementById('dashboard-section').classList.remove('hidden');
        } else {
          alert(data.message || 'Login failed. Check your Shop ID or PIN.');
        }
      } catch (err) {
        alert('Network error. Please try again.');
      }
    }

    function logout() {
      document.getElementById('shop-pin-input').value = '';
      document.getElementById('dashboard-section').classList.add('hidden');
      document.getElementById('login-section').classList.remove('hidden');
    }
  </script>
</body>
</html>
