<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchant Dashboard - Private Feedback</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-6">

  <div class="max-w-3xl mx-auto">
    <header class="bg-white p-6 rounded-2xl shadow-sm mb-6 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold text-slate-900">🛡️ Merchant Feedback Dashboard</h1>
        <p class="text-xs text-slate-400 mt-1">Intercepted customer complaints & suggestions</p>
      </div>
      <button onclick="loadFeedbacks()" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">
        🔄 Refresh
      </button>
    </header>

    <!-- Feedback List Table -->
    <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
      <div class="p-4 border-b border-slate-100 font-semibold text-sm text-slate-600">
        Recent Private Feedback
      </div>
      <div id="feedback-list" class="divide-y divide-slate-100">
        <!-- Dynamically loaded -->
        <div class="p-6 text-center text-sm text-slate-400">Loading feedbacks...</div>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const shopId = urlParams.get('shop') || 'pj_kopi';

    async function loadFeedbacks() {
      const listContainer = document.getElementById('feedback-list');
      listContainer.innerHTML = `<div class="p-6 text-center text-sm text-slate-400">Loading feedbacks...</div>`;

      try {
        const res = await fetch(`/api/feedbacks/${shopId}`);
        const data = await res.json();

        if (data.success && data.feedbacks.length > 0) {
          listContainer.innerHTML = data.feedbacks.map(item => `
            <div class="p-5 flex flex-col gap-2 hover:bg-slate-50 transition">
              <div class="flex justify-between items-center text-xs text-slate-400">
                <span class="font-medium text-slate-600">👤 ${item.contact}</span>
                <span>⏰ ${item.time}</span>
              </div>
              <p class="text-sm text-slate-700 bg-slate-50 p-3 rounded-xl border border-slate-100">
                "${item.feedback}"
              </p>
            </div>
          `).join('');
        } else {
          listContainer.innerHTML = `<div class="p-6 text-center text-sm text-slate-400">No private feedback yet. Great job! 🎉</div>`;
        }
      } catch (err) {
        listContainer.innerHTML = `<div class="p-6 text-center text-sm text-red-400">Failed to load feedbacks.</div>`;
      }
    }

    loadFeedbacks();
  </script>
</body>
</html>
